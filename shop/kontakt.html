<body data-page="kontakt">
<div id="ds-header"></div>
<main class="wrap" id="main">
<div class="crumb"><a href="index.html">Početna</a><span>/</span><span>Kontakt</span></div>
<div class="cart-page">
<div>
<h1>Javite nam se</h1>
<p class="intro">Pitanje o proizvodu, narudžba za tvrtku ili poklon paket po mjeri – odgovaramo u najkraćem roku.</p>
<form class="checkout" id="kontakt-form" novalidate>
<label>Ime i prezime<input name="ime" required autocomplete="name"></label>
<label>E-mail<input name="email" type="email" required autocomplete="email"></label>
<label class="full">Tema<select name="tema"><option value="opcenito">Općenito</option><option value="ugostitelji">Za ugostitelje (HoReCa)</option><option value="poklon">Poklon paketi i tvrtke</option><option value="narudzba">Moja narudžba</option></select></label>
<label class="full">Poruka<textarea name="poruka" required style="min-height:140px"></textarea></label>
<label class="chk full"><input type="checkbox" name="privola" required> Slažem se da se moji podaci koriste za odgovor na upit.</label>
<p class="err full" id="kerr" role="alert" hidden></p>
<div class="full"><button class="btn" type="submit">Pošalji poruku</button></div>
</form>
</div>
<aside class="box" id="dostava"><h2>Kontakt</h2>
<div class="cinfo"><a data-href="tel"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2Z"/></svg><span data-k="tel"></span></a>
<a data-href="mail"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="m4 6.5 8 6 8-6"/></svg><span data-k="email"></span></a>
<span><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-k="radnoVrijeme"></span></span></div>
<h2 style="font-size:24px;margin-top:6px">Dostava i plaćanje</h2>
<div class="tot"><span>Besplatna dostava</span><span>iznad <span data-k="od"></span></span></div>
<div class="tot"><span>Ostala dostava</span><span data-k="cijena"></span></div>
<div class="tot"><span>Slanje</span><span data-k="rok"></span></div>
<p class="note">Alkoholna pića prodajemo isključivo punoljetnim osobama (18+). <a href="info.html#dostava" style="color:var(--burgundy)">Sve o dostavi →</a></p>
</aside>
</div>
</main>
